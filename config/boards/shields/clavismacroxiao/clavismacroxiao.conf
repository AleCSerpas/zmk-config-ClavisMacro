# ============================================================
# ClavisMacro — PRUEBA RGB SIN PANTALLA
# XIAO nRF52840 Plus
# ============================================================

# ============================================================
# USB, BLUETOOTH Y SETTINGS
# ============================================================

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y

# ============================================================
# AHORRO DE ENERGÍA
# ============================================================

CONFIG_ZMK_IDLE_TIMEOUT=60000

# ============================================================
# HARDWARE GENERAL
# ============================================================

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y

# ============================================================
# ENCODERS EC11
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================
# PANTALLA — DESACTIVADA SOLO PARA ESTA PRUEBA
# ============================================================

CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Se conservan porque el overlay todavía contiene gpio-leds,
# pero la pantalla y LVGL no se inicializarán.
CONFIG_LED=y
CONFIG_LED_GPIO=y

# ============================================================
# PRUEBA DIRECTA DEL DRIVER RGB
# ============================================================

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI=y

# Desactivar el motor RGB de ZMK para evitar dos escritores
# usando la misma tira simultáneamente.
CONFIG_ZMK_RGB_UNDERGLOW=n

# ============================================================
# USB LOGGING — SOLO PARA DIAGNÓSTICO
# ============================================================

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000