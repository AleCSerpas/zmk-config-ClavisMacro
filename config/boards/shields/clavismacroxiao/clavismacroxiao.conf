# ============================================================
# ClavisMacro — XIAO nRF52840 Plus
# ============================================================

# USB, Bluetooth and persistent settings
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y

# ============================================================
# POWER
# ============================================================

# Enter idle after one minute.
CONFIG_ZMK_IDLE_TIMEOUT=60000

# ============================================================
# GENERAL HARDWARE
# ============================================================

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y

# ============================================================
# TWO EC11 ENCODERS
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================
# ST7789 DISPLAY + CUSTOM LVGL STATUS SCREEN
# ============================================================

CONFIG_DISPLAY=y
CONFIG_LED=y
CONFIG_LED_GPIO=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# RGB565 display mode
CONFIG_LV_COLOR_DEPTH_16=y

# Widgets used by clavis_status_screen.c
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LABEL=y

# Fonts used by the custom screen
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y

# Extra LVGL memory for the custom 240x240 interface
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# ============================================================
# 10 SK6812MINI-E — SPI-BASED UNDERGLOW
# ============================================================

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Initial state. Persistent settings may override these values.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10

# Limit actual LED output to reduce battery use.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40

# Turn off the strip when ZMK enters idle.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Allow underglow while using either USB or battery.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
