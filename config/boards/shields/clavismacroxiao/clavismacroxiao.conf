# ============================================================
# ClavisMacro XIAO nRF52840 Plus
# ============================================================

# USB, Bluetooth y almacenamiento de configuraciones
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y

# ============================================================
# KSCAN TEMPORAL
# ============================================================
# Por ahora usamos una matriz simulada.
# Los sensores Hall se agregarán después mediante un driver propio.

CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=1
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=1

# ============================================================
# HARDWARE GENERAL
# ============================================================

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y

# ============================================================
# PANTALLA ST7789
# ============================================================

CONFIG_DISPLAY=y

# Necesario para controlar BL mediante el nodo gpio-leds
CONFIG_LED=y
CONFIG_LED_GPIO=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Cola dedicada para que la pantalla no retrase el escaneo
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Apagar pantalla y backlight al entrar en idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ST7789 trabaja en RGB565
CONFIG_LV_COLOR_DEPTH_16=y

# El status screen integrado de ZMK no inicializa otro tema
# explícitamente; usamos el tema mono para tener texto visible.
CONFIG_LV_USE_THEME_MONO=y
CONFIG_ZMK_DISPLAY_INVERT=y

# ============================================================
# 10 SK6812MINI-E
# ============================================================

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

CONFIG_ZMK_RGB_UNDERGLOW=y

# La PCB alimenta directamente los LEDs.
# No existe un switch zmk,ext-power-generic.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Estado inicial
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

# Limitar el brillo para no desperdiciar tanta energía
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10

# Apagar los LEDs cuando el teclado queda inactivo
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Permitir que también funcionen usando batería
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n