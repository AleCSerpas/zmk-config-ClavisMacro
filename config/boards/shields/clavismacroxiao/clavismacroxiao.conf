# ============================================================
# ClavisMacro — PRUEBA RGB SIN PANTALLA
# XIAO nRF52840 Plus
# ============================================================

# ============================================================
# USB, BLUETOOTH Y SETTINGS
# ============================================================

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y

# ============================================================
# AHORRO DE ENERGÍA
# ============================================================

CONFIG_ZMK_IDLE_TIMEOUT=60000

# ============================================================
# HARDWARE GENERAL
# ============================================================

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y

# ============================================================
# ENCODERS EC11
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================
# PANTALLA — DESACTIVADA SOLO PARA ESTA PRUEBA
# ============================================================

CONFIG_DISPLAY=n
CONFIG_ZMK_DISPLAY=n

# Se conservan porque el overlay todavía contiene gpio-leds,
# pero la pantalla y LVGL no se inicializarán.
CONFIG_LED=y
CONFIG_LED_GPIO=y

# ============================================================
# RGB UNDERGLOW — 10 SK6812MINI-E
# ============================================================

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100

# Mantener las luces encendidas durante idle para no mezclar
# el problema de actualización con el apagado automático.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# ============================================================
# USB LOGGING — SOLO PARA DIAGNÓSTICO
# ============================================================

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000