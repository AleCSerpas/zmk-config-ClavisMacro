# ============================================================
# ClavisMacro — XIAO nRF52840 Plus
# ============================================================

# ============================================================
# USB, BLUETOOTH Y ALMACENAMIENTO
# ============================================================

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y

# ============================================================
# AHORRO DE ENERGÍA
# ============================================================

# 60 segundos antes de que la pantalla entre en idle.
CONFIG_ZMK_IDLE_TIMEOUT=60000

# ============================================================
# HARDWARE GENERAL
# ============================================================

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y

# ============================================================
# ENCODERS EC11
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================
# PANTALLA ST7789
# ============================================================

CONFIG_DISPLAY=y

CONFIG_LED=y
CONFIG_LED_GPIO=y

CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

CONFIG_LV_USE_THEME_MONO=y
CONFIG_ZMK_DISPLAY_INVERT=y

# Widgets usados por la UI personalizada
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y

# Fuentes usadas por la UI personalizada
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y

# ============================================================
# RGB UNDERGLOW — 10 SK6812MINI-E
# ============================================================

CONFIG_LED_STRIP=y

# Driver SPI para WS2812/SK6812.
CONFIG_WS2812_STRIP_SPI=y

CONFIG_ZMK_RGB_UNDERGLOW=y

# Nuestra PCB no tiene un transistor de alimentación RGB
# controlado mediante ext-power.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Encender las luces al iniciar.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Estado inicial. Los valores guardados por ZMK pueden reemplazar
# estos después del primer arranque.
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

# Ajustes de brillo.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10

# ============================================================
# PRUEBA RGB
# ============================================================

# Temporalmente NO apagar las LEDs al entrar en idle.
#
# Queremos probar primero si el worker RGB permanece vivo.
# La pantalla sí seguirá apagándose después de 60 segundos.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n

# No apagar las LEDs cuando estemos conectados por USB.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n