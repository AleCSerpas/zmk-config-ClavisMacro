# ============================================================
# ClavisMacro — XIAO nRF52840 Plus
# PRUEBA DEL CLAVIS RGB MATRIX v1
# ============================================================

# ============================================================
# USB, BLUETOOTH Y ALMACENAMIENTO
# ============================================================

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Necesario para guardar efecto, brillo, color, velocidad,
# dirección y selección de LEDs del motor Clavis.
CONFIG_SETTINGS=y

# ============================================================
# AHORRO DE ENERGÍA
# ============================================================

# Entrar en idle después de 60 segundos.
# Por ahora el motor RGB propio seguirá funcionando.
CONFIG_ZMK_IDLE_TIMEOUT=60000

# ============================================================
# HARDWARE GENERAL
# ============================================================

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y

# ============================================================
# ENCODERS EC11
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================
# PANTALLA — DESACTIVADA SOLO PARA ESTA PRIMERA PRUEBA
# ============================================================

# No se elimina ningún archivo de la pantalla.
# Solamente evitamos que ST7789 y LVGL se inicialicen mientras
# verificamos todos los efectos del nuevo motor RGB.

CONFIG_DISPLAY=n
CONFIG_ZMK_DISPLAY=n

# El overlay aún contiene el nodo gpio-leds del backlight.
CONFIG_LED=y
CONFIG_LED_GPIO=y

# ============================================================
# CLAVIS RGB MATRIX — 10 SK6812MINI-E
# ============================================================

# API genérica de tiras LED de Zephyr.
CONFIG_LED_STRIP=y

# Driver físico WS2812/SK6812 mediante SPI.
CONFIG_WS2812_STRIP_SPI=y

# MUY IMPORTANTE:
# El motor underglow original de ZMK debe permanecer apagado.
# Nuestro clavis_rgb_engine.c controla directamente la tira.
CONFIG_ZMK_RGB_UNDERGLOW=n

# ============================================================
# FIN
# ============================================================