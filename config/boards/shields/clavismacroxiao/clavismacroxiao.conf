# ============================================================
# ClavisMacro — XIAO nRF52840 Plus
# ============================================================

# ============================================================
# USB, BLUETOOTH Y ALMACENAMIENTO
# ============================================================

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_SETTINGS=y

# ============================================================
# AHORRO DE ENERGÍA
# ============================================================

CONFIG_ZMK_IDLE_TIMEOUT=60000

# ============================================================
# HARDWARE GENERAL
# ============================================================

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_ADC=y

# ============================================================
# ENCODERS EC11
# ============================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ============================================================
# PANTALLA ST7789
# ============================================================

CONFIG_DISPLAY=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=n

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

CONFIG_LV_USE_THEME_MONO=y
CONFIG_ZMK_DISPLAY_INVERT=y

CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y

CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_24=y

CONFIG_LV_Z_MEM_POOL_SIZE=16384

CONFIG_LED=y
CONFIG_LED_GPIO=y

# ============================================================
# CLAVIS RGB MATRIX — 10 SK6812MINI-E
# ============================================================

CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y

# Built-in ZMK underglow remains disabled.
# clavis_rgb_engine.c owns the LEDs.
CONFIG_ZMK_RGB_UNDERGLOW=n
