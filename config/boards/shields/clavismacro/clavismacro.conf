# ClavisMacro — ZMK configuration
# Board: nice_nano_v2 / SuperMini nRF52840

# Rotary encoder EC11
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Temporarily poll the matrix to reproduce the known-working Arduino scan
# and eliminate GPIO interrupt/wakeup behavior as a troubleshooting variable.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# USB and Bluetooth HID
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Save Bluetooth pairings/settings
CONFIG_SETTINGS=y
