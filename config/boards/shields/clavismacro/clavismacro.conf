# ClavisMacro — matrix-only diagnostic

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_SETTINGS=y

# Polling avoids GPIO interrupt issues during diagnosis.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# Give the matrix pins time to settle before reading.
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=1
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=1